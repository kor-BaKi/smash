spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/smash?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:smash_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    jpa:
      show-sql: false
      properties:
        hibernate:
          format_sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
app:
  upload-dir: /home/baki/smash-files/photos
  base-url: https://baki.tailbdb322.ts.net
logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF