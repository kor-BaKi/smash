spring:
  application:
    name: smash
  datasource:
    url: jdbc:mysql://localhost:3306/smash?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 15552000000
app:
  upload-dir: /home/baki/smash-files/photos
  base-url: https://baki.tailbdb322.ts.net